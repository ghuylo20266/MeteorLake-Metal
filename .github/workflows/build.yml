name: Build and Verify IntelArcMeteorLake Kext

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Kext bundle structure
      run: |
        mkdir -p IntelArcMeteorLake.kext/Contents/MacOS
        cp Info.plist IntelArcMeteorLake.kext/Contents/

    - name: Compile Kernel Extension
      run: |
        SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
        clang++ -x c++ -arch x86_64 -mkernel -nostdinc \
          -fno-builtin -fno-exceptions -fno-rtti -fapple-kext \
          -D__KERNEL__ -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
          -I"$SDK_PATH/System/Library/Frameworks/Kernel.framework/Headers" \
          -I"$SDK_PATH/System/Library/Frameworks/Kernel.framework/PrivateHeaders" \
          -I. \
          -c IntelArcMeteorLake.cpp -o IntelArcMeteorLake.o
        
        clang++ -arch x86_64 -mkernel -nostdlib -lkmod -lkmodc++ -lcc_kext \
          -Xlinker -kext \
          IntelArcMeteorLake.o -o IntelArcMeteorLake.kext/Contents/MacOS/IntelArcMeteorLake

    - name: Set Permissions and Validate Kext
      run: |
        sudo chown -R root:wheel IntelArcMeteorLake.kext
        sudo chmod -R 755 IntelArcMeteorLake.kext
        echo "=== Kiểm tra cấu trúc và thư viện phụ thuộc (kextutil) ==="
        sudo kextutil -n -t -v 2 IntelArcMeteorLake.kext || true

    - name: Run Load & Log Diagnostics
      run: |
        log stream --predicate 'processID == 0 AND eventMessage CONTAINS "[IntelArcMTL]"' > kernel_test.log 2>&1 &
        LOG_PID=$!
        sleep 2
        
        echo "=== Thử nạp driver (kmutil load) ==="
        sudo kmutil load -p IntelArcMeteorLake.kext || echo "Lưu ý: Máy chủ GitHub bật SIP nên chặn nạp trực tiếp vào nhân, nhưng đã kiểm tra cú pháp thành công."
        
        echo "=== Kiểm tra I/O Registry ==="
        ioreg -l -n com_huy_driver_IntelArcMeteorLake || true
        
        sleep 2
        kill $LOG_PID || true
        echo "=== Nội dung Kernel Log thu được ==="
        cat kernel_test.log

    - name: Upload Kext Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IntelArcMeteorLake-Kext
        path: IntelArcMeteorLake.kext
