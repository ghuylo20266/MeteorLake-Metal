name: Build macOS Intel Arc Kext

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-kext:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Kernel Extension (MH_KEXT_BUNDLE)
        run: |
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p IntelArcMeteorLake.kext/Contents/MacOS
          cp Info.plist IntelArcMeteorLake.kext/Contents/Info.plist

          clang++ -arch x86_64 \
            -mkernel \
            -fapple-kext \
            -nostdinc \
            -fno-builtin \
            -fno-exceptions \
            -fno-rtti \
            -isysroot "$SDK_PATH" \
            -I"$SDK_PATH/System/Library/Frameworks/Kernel.framework/Headers" \
            -c IntelArcMeteorLake.cpp -o IntelArcMeteorLake.o

          clang++ -arch x86_64 \
            -mkernel \
            -fapple-kext \
            -nostdlib \
            -Wl,-kext \
            -lkmodc++ \
            -lkmod \
            -lcc_kext \
            IntelArcMeteorLake.o \
            -o IntelArcMeteorLake.kext/Contents/MacOS/IntelArcMeteorLake

          file IntelArcMeteorLake.kext/Contents/MacOS/IntelArcMeteorLake
          otool -hv IntelArcMeteorLake.kext/Contents/MacOS/IntelArcMeteorLake

      - name: Upload Compiled Kext Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntelArcMeteorLake-Kext
          path: IntelArcMeteorLake.kext
